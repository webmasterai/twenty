name: Supply-Chain Malware Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  security-audit:
    name: Scan for Stealth Injections & Trojans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Detect Fake Init Files
        run: |
          echo "Scanning for root/subfolder fake init files..."
          FOUND=$(find . -maxdepth 3 -type f \( -name "init" -o -name "init.js" -o -name "init.mjs" \) | grep -v "/node_modules/" | grep -v "/vendor/" | grep -v "/bower_components/" || true)
          if [ -n "$FOUND" ]; then
            echo "🚨 CRITICAL SECURITY ALERT: Unauthorized init file detected: $FOUND"
            exit 1
          fi

      - name: 1b. Detect Known Dropper Files
        run: |
          FOUND=$(find . -maxdepth 4 -type f \( -name "api.js" -o -name "*.lfk" -o -name "fa-solid-*.woff2" -o -name "fa-solid-*.ttf" -o -name ".npm-ws-runner.js" \) -not -path "*/node_modules/*" || true)
          if [ -n "$FOUND" ]; then
            echo "🚨 CRITICAL SECURITY ALERT: Known dropper filename detected: $FOUND"
            exit 1
          fi

      - name: 2a. package.json scripts may only run node on scripts/*
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("./package.json")) {
              console.log("No package.json found in root, skipping script check.");
              process.exit(0);
            }
            let s = {};
            try {
              s = JSON.parse(fs.readFileSync("./package.json", "utf8")).scripts || {};
            } catch (e) {
              console.log("package.json could not be parsed, skipping script check.");
              process.exit(0);
            }
            const bad = Object.entries(s).filter(([, cmd]) =>
              /(^|&&|;|\|\|)\s*node\s+(?!scripts\/)[^\s-]/.test(cmd));
            const hooks = Object.keys(s).filter((k) => /^(pre|post)?install$|^prepare$/.test(k));
            if (bad.length || hooks.length) {
              console.error("🚨 Suspicious package.json scripts:", bad, hooks);
              process.exit(1);
            }
            console.log("✅ package.json scripts OK");
          '

      - name: 2. Detect Suspicious package.json Hooks
        run: |
          echo "Scanning package.json scripts for 'node init'..."
          if grep -rn -I "node init" **/package.json package.json 2>/dev/null; then
            echo "🚨 CRITICAL SECURITY ALERT: Malicious 'node init' hook detected in package.json!"
            exit 1
          fi

      - name: 3. Detect Hidden Whitespace Padding (>150 characters)
        run: |
          echo "Scanning config files for off-screen whitespace padding..."
          SUSPICIOUS=$(grep -rnE "[ \t]{150,}" --include="*.config.*" --include="*.mjs" --include="*.js" --include="*.ts" --exclude-dir=".github" . 2>/dev/null | grep -v "/dist/" | grep -v "/build/" | grep -v "/node_modules/" | grep -v "/vendor/" || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "🚨 CRITICAL SECURITY ALERT: Hidden off-screen whitespace detected:"
            echo "$SUSPICIOUS"
            exit 1
          fi

      - name: 4. Detect Known Smart-Contract C2 Signatures
        run: |
          echo "Scanning for EtherHiding / PolinRider smart contract signatures..."
          # Signatures are Base64 decoded at runtime to prevent scanner false positives on this workflow file
          SIG_WALLET=$(echo "MHgxZUVmMDg0OUVEYTE1ZDg3ZjY0ZTUxQzczQzg0NDJDZjNjOGJDRUYz" | base64 -d)
          SIG_SPIN=$(echo "c3BpbixzcGxpdExhbmU=" | base64 -d)
          SIG_VARZ=$(echo "dmFyIHogPSAnLQ==" | base64 -d)
          SIG_GLOB=$(echo "Z2xvYmFsLmkgPSAnQTg=" | base64 -d)
          SIGNATURES="($SIG_WALLET|$SIG_SPIN|$SIG_VARZ|$SIG_GLOB)"
          MATCHES=$(grep -rnEI "$SIGNATURES" --exclude-dir=".github" --exclude="*.ttf" --exclude="*.woff" --exclude="*.woff2" --exclude="*.png" --exclude="*.jpg" --exclude="*.svg" . 2>/dev/null | grep -v "/node_modules/" | grep -v "/vendor/" || true)
          if [ -n "$MATCHES" ]; then
            echo "🚨 CRITICAL SECURITY ALERT: Known Trojan pattern detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ Repository passed all malware and supply-chain security checks!"
